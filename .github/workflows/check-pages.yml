name: Check static site assets
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v
          node --check assets/diagnostics.js
          node --check assets/support.js
          node tests/test_web_diagnostics.js
      - name: Audit site assets
        run: python tools/site_audit_fix.py . --repo dvizhoff --check
