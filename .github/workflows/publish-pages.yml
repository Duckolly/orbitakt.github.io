name: Publish Dvizh site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dvizhoff-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run checks
        run: |
          python -m unittest discover -s tests -v
          python tools/site_audit_fix.py . --repo dvizhoff --check
          node --check assets/diagnostics.js
          node --check assets/support.js
          node tests/test_web_diagnostics.js

      - name: Package only public website files
        shell: bash
        run: |
          mkdir -p _site
          cp index.html privacy.html support.html .nojekyll _site/
          cp -R assets _site/
          test -f _site/index.html
          test -f _site/assets/style.css
          test -f _site/assets/diagnostics.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
